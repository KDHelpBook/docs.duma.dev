# yaml-language-server: $schema=./node_modules/@kdhelpbook/cf-registry/schema/khb-registry.schema.json
schema: 1

site:
  order:
    - khb-authoring
    - khb-publishing
    - khb-registry
  folders:
    - id: khb
      title: KD Help Book
      titles:
        pl: KD Help Book
      children:
        - collection: khb-docs
  config:
    externalSources: false
    pwa: false
    prefetch: false
    prefetchLocked: true

publishers:
  - repository: KDHelpBook/monorepo
    ref: refs/heads/main
    environment: null
    docsets:
      - khb-authoring
      - khb-publishing
      - khb-registry
    force: false
