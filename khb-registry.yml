# yaml-language-server: $schema=./node_modules/@kdhelpbook/cf-registry/schema/khb-registry.schema.json
schema: 1

site:
  order:
    - khb-authoring
    - khb-publishing
    - khb-registry
    - nfc-to-rfid

  folders:
    - id: open-source
      title: Open Source Projects
      titles:
        pl: Projekty Open Source
      children:
        - id: documentation
          title: Documentation
          titles:
            pl: Dokumentacja
          children:
            - collection: khb-docs

        - id: autoid-solutions
          title: AutoID Solutions
          titles:
            pl: Rozwiązania AutoID
          children:
            - collection: nfc-to-rfid

  config:
    externalSources: false
    pwa: false
    prefetch: false
    prefetchLocked: false

publishers:
  - repository: KDHelpBook/monorepo
    ref: refs/heads/main
    environment: null
    docsets:
      - khb-authoring
      - khb-publishing
      - khb-registry
    force: false

  - repository: kduma-autoid/android-sunmi-nfc-to-uhf-rfid
    ref: refs/heads/main
    environment: null
    docsets:
      - nfc-to-rfid
    force: false
